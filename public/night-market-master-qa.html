<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜市大師版・預覽版面驗收</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#e2e8f0;color:#183b34}header{padding:10px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{min-height:44px;padding:8px 12px;background:#fff8e7;border:1px solid #9f8357;border-radius:8px;font-weight:bold;cursor:pointer}button[aria-pressed=true]{background:#174b44;color:white}main{padding:16px;width:max-content}iframe{display:block;border:0;box-shadow:0 3px 18px #0004;background:white}p{margin:0 12px 12px;font-size:14px}output{font-weight:bold}</style><header><strong>預覽專用・實際遊戲 iframe</strong><button data-size="844,390" aria-pressed="true">844×390</button><button data-size="896,414" aria-pressed="false">896×414</button><button data-size="932,430" aria-pressed="false">932×430</button><button data-size="844,300" aria-pressed="false">844×300 短高度</button><button data-size="1024,768" aria-pressed="false">iPad 1024×768</button><button data-size="1440,900" aria-pressed="false">投影 1440×900</button><output id="size">844×390</output></header><p>這是瀏覽器 CSS 版面驗收，不是 iPhone／iPad 實機測試。切換尺寸不重載遊戲，不注入餐盤／分數或修改既有暫存。此檔只放預覽分支，不進正式版。</p><main><iframe title="夜市大師版驗收畫面" src="/" width="844" height="390"></iframe></main><script>for(const button of document.querySelectorAll('[data-size]'))button.addEventListener('click',()=>{const [w,h]=button.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;document.querySelector('output').textContent=w+'×'+h;for(const b of document.querySelectorAll('[data-size]'))b.setAttribute('aria-pressed',String(b===button));});</script></html>
